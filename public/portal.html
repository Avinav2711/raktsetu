<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaktSetu — My Workspace</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>.portal{max-width:1200px;margin:auto;padding:38px 24px}.portalhead{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.portal h1{font:800 34px Manrope;margin:6px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e7e7ea;border-radius:16px;padding:20px}.card strong{font:800 27px Manrope;display:block}.card span{color:#6b7280}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid #e7e7ea;border-radius:16px;padding:22px}.panel h2{font:800 19px Manrope;margin:0 0 18px}.profile{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{padding:12px;background:#f7f7f8;border-radius:11px}.row small{display:block;color:#6b7280;margin-bottom:3px}.actions{display:flex;gap:10px;flex-wrap:wrap}.item{padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.item strong{display:block}.item small{color:#6b7280}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fef2f2;color:#991b1b;font-size:12px;font-weight:700;margin-top:5px}.sos{display:block;padding:14px 16px;margin-bottom:12px;border:1px solid #fecaca;background:#fff1f2;color:#991b1b;border-radius:14px;font-weight:700}.sos small{display:block;color:#7f1d1d;font-weight:500;margin-top:4px}.ok{background:#f0fdf4;color:#166534}.empty{color:#6b7280}@media(max-width:850px){.cards{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:520px){.cards,.profile{grid-template-columns:1fr}.portal{padding:25px 16px}.portalhead{align-items:flex-start;flex-direction:column}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brandmark">✦</span><span>Rakt<span>Setu</span></span></a><div class="actions"><button class="btn btn-outline" id="notify">Notifications</button><button class="btn btn-outline" id="signout">Sign out</button></div></header><main class="portal"><div class="portalhead"><div><div class="eyebrow" id="roleLabel">MY WORKSPACE</div><h1 id="hello">Loading…</h1><p>Manage your RaktSetu activity from one secure workspace.</p></div><div class="actions"><button class="btn btn-primary" id="primaryAction">Get started</button></div></div><div class="cards"><div class="card"><strong id="stat1">—</strong><span id="stat1label">Profile</span></div><div class="card"><strong id="stat2">—</strong><span id="stat2label">Activity</span></div><div class="card"><strong id="stat3">—</strong><span id="stat3label">Impact</span></div><div class="card"><strong id="stat4">—</strong><span id="stat4label">Status</span></div></div><div class="layout"><section class="panel"><h2>Profile</h2><div class="profile" id="profile"></div><div class="actions" style="margin-top:15px"><button class="btn btn-soft" id="edit">Edit profile</button></div></section><section class="panel"><h2 id="activityTitle">Recent activity</h2><div id="activity"></div></section></div><section class="panel" style="margin-top:18px"><h2>Quick actions</h2><div class="actions"><button class="btn btn-primary" id="requestBtn">Create blood request</button><button class="btn btn-soft" id="donationBtn">Record donation</button><button class="btn btn-outline" id="campBtn">View camps</button></div></section></main><div class="modal-backdrop" id="modal"><div class="modal"><button class="close" id="close">×</button><div id="content"></div></div></div><script>const API=window.__HATCHABLE__?.api||'/api';const $=id=>document.getElementById(id);let me=null;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#39;','"':'&quot;'}[c]));async function api(path,opt){const r=await fetch(API+path,opt);if(r.status===401){location.href='/login?next=/portal.html';throw new Error('login');}const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){me=await api('/me');try{const ns=await api('/notifications');const unread=ns.filter(x=>!x.read).length;$('notify').textContent=unread?`Notifications (${unread})`:'Notifications'}catch(e){}$('hello').textContent='Hello, '+(me.name||me.email);$('roleLabel').textContent=(me.role||'donor').toUpperCase()+' WORKSPACE';$('profile').innerHTML=`<div class="row"><small>Name</small><b>${esc(me.name||'—')}</b></div><div class="row"><small>Email</small><b>${esc(me.email)}</b></div><div class="row"><small>Blood group</small><b>${esc(me.blood_group||'Not set')}</b></div><div class="row"><small>City</small><b>${esc(me.city||'Not set')}</b></div>`;if(me.role==='requester')await requester();else if(['hospital','blood_bank'].includes(me.role))await operator();else await donor()}async function donor(){const [ds,camps,opp]=await Promise.all([api('/my-donations'),api('/camps'),api('/request-actions')]);$('stat1').textContent=ds.length;$('stat1label').textContent='donations';$('stat2').textContent=ds.reduce((a,x)=>a+Number(x.units||0),0);$('stat2label').textContent='units donated';$('stat3').textContent=opp.requests.length;$('stat3label').textContent='matching requests';$('stat4').textContent=me.available?'Available':'Unavailable';$('stat4label').textContent='donor status';$('activityTitle').textContent='Donation history';$('activity').innerHTML=ds.map(x=>`<div class="item"><strong>${esc(x.blood_group)} • ${x.units} unit${x.units>1?'s':''}</strong><small>${esc(x.facility)} • ${esc(x.city)} • ${esc(x.donation_date)}</small><div><span class="pill ok">${esc(x.status)}</span></div></div>`).join('')||'<p class="empty">No donations recorded yet.</p>';$('primaryAction').textContent='Update availability';$('primaryAction').onclick=()=>toggleAvailability();$('requestBtn').textContent='Find matching requests';$('requestBtn').onclick=()=>showDonorRequests();}async function showDonorRequests(){const d=await api('/request-actions');modal('<h2>Matching blood requests</h2>'+d.requests.map(x=>`<div class=\"item\" style=\"${x.urgency==='Critical'?'border:1px solid #fecaca;background:#fff7f7;padding:14px;border-radius:12px;margin-bottom:8px':''}\"><strong>${x.urgency==='Critical'?'🚨 ':''}${esc(x.blood_group)} • ${x.units} unit${x.units>1?'s':''}</strong><small>${esc(x.facility)} • ${esc(x.city)} • ${esc(x.urgency)} • ${esc(x.requester_name)}</small><div><span class=\"pill ${x.response_status==='Accepted'?'ok':''}\">${esc(x.response_status||x.status)}</span> ${x.response_status?'<button class=\"btn btn-soft\" onclick=\"viewRequestResponse(\\''+x.id+'\\')\">View</button>':'<button class=\"btn btn-primary\" onclick=\"respondToRequest(\\''+x.id+'\\',\\'accept\\')\">Accept</button> <button class=\"btn btn-soft\" onclick=\"respondToRequest(\\''+x.id+'\\',\\'decline\\')\">Decline</button>'}</div></div>`).join('')||'<p class=\"empty\">No matching open blood requests right now.</p>')}async function respondToRequest(id,action){const d=await api('/request-actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:id,action})});modal('<h2>Response recorded</h2><p>'+esc(d.message)+'</p>');load()}async function viewRequestResponse(id){const d=await api('/request-actions?requestId='+encodeURIComponent(id));modal('<h2>Request status</h2><p><b>'+esc(d.request.blood_group)+'</b> • '+esc(d.request.units)+' unit(s) • '+esc(d.request.status)+'</p>'+d.responses.map(x=>`<div class=\"item\"><strong>${esc(x.name)}</strong><small>${esc(x.city)} • ${esc(x.email)}</small><div><span class=\"pill ok\">${esc(x.status)}</span></div></div>`).join('')||'<p class=\"empty\">No donor responses yet.</p>')}async function requester(){const rs=await api('/my-requests');$('stat1').textContent=rs.length;$('stat1label').textContent='my requests';$('stat2').textContent=rs.filter(x=>x.status==='Open').length;$('stat2label').textContent='open requests';$('stat3').textContent=rs.filter(x=>x.urgency==='Critical').length;$('stat3label').textContent='critical';$('stat4').textContent='Active';$('stat4label').textContent='request status';$('activityTitle').textContent='Request history';const critical=rs.filter(x=>x.urgency==='Critical'&&['Open','Donor Accepted','Donor Contacted'].includes(x.status));$('activity').innerHTML=(critical.length?critical.map(x=>`<div class="sos">🚨 Emergency SOS • ${esc(x.blood_group)} • ${x.units} unit${x.units>1?'s':''}<small>${esc(x.facility)} • ${esc(x.city)} • ${esc(x.status)} — <button class="btn btn-soft" style="padding:5px 9px" onclick="trackRequest('${x.id}')">Track now</button></small></div>`).join(''):'')+ (rs.map(x=>`<div class="item"><strong>${esc(x.blood_group)} • ${x.units} unit${x.units>1?'s':''}</strong><small>${esc(x.facility)} • ${esc(x.city)} • ${esc(x.created_at).slice(0,10)}</small><div><span class="pill">${esc(x.urgency)} • ${esc(x.status)}</span> <button class="btn btn-soft" style="margin-left:6px;padding:6px 10px" onclick="trackRequest('${x.id}')">Track request</button></div></div>`).join('')||'<p class="empty">No requests yet.</p>');$('primaryAction').textContent='Create request';$('primaryAction').onclick=()=>requestModal();$('requestBtn').textContent='Emergency SOS request';$('requestBtn').onclick=()=>requestModal(true);$('donationBtn').textContent='Find available donors';$('donationBtn').onclick=()=>location.href='/discovery.html';}async function operator(){const [rs,inv,ds,camps]=await Promise.all([api('/requests'),api('/inventory'),api('/donations'),api('/camps')]);const isBank=me.role==='blood_bank';$('stat1').textContent=isBank?inv.inventory.length:rs.length;$('stat1label').textContent=isBank?'inventory lines':'blood requests';$('stat2').textContent=isBank?inv.inventory.reduce((a,x)=>a+Number(x.units||0),0):rs.filter(x=>x.status==='Open').length;$('stat2label').textContent=isBank?'units in inventory':'open requests';$('stat3').textContent=ds.length;$('stat3label').textContent='donations';$('stat4').textContent=camps.length;$('stat4label').textContent='upcoming camps';$('activityTitle').textContent=isBank?'Blood inventory':'Operational requests';$('activity').innerHTML=(isBank?inv.inventory:rs).slice(0,8).map(x=>isBank?`<div class="item"><strong>${esc(x.blood_group)} • ${x.units} unit${x.units>1?'s':''}</strong><small>${esc(x.facility)} • ${esc(x.city)}</small><div><span class="pill ${Number(x.units)>5?'ok':''}">${esc(x.status)}</span></div></div>`:`<div class="item"><strong>${esc(x.blood_group)} • ${x.units} unit${x.units>1?'s':''}</strong><small>${esc(x.facility)} • ${esc(x.city)} • ${esc(x.urgency)}</small><div><span class="pill">${esc(x.status)}</span></div></div>`).join('')||'<p class="empty">No operational records yet.</p>';$('primaryAction').textContent='Open Operations Center';$('primaryAction').onclick=()=>location.href='/operator.html';$('requestBtn').textContent='View requests';$('requestBtn').onclick=()=>showRequests(rs);$('donationBtn').textContent='View donations';$('donationBtn').onclick=()=>showDonations(ds);$('campBtn').textContent='Manage camps';$('campBtn').onclick=()=>showCamps(camps);}async function showInventory(rows){modal('<h2>Blood inventory</h2>'+rows.map(x=>`<div class="item"><strong>${esc(x.blood_group)} • ${x.units} units</strong><small>${esc(x.facility)} • ${esc(x.city)}</small></div>`).join('')||'<p class="empty">No inventory records.</p>')}async function showRequests(rows){modal('<h2>Blood requests</h2>'+rows.map(x=>`<div class="item"><strong>${esc(x.blood_group)} • ${x.units} units</strong><small>${esc(x.facility)} • ${esc(x.city)} • ${esc(x.urgency)}</small><div><span class="pill">${esc(x.status)}</span></div></div>`).join('')||'<p class="empty">No requests.</p>')}async function showDonations(rows){modal('<h2>Donation records</h2>'+rows.map(x=>`<div class="item"><strong>${esc(x.blood_group)} • ${x.units} units</strong><small>${esc(x.donor_name)} • ${esc(x.facility)} • ${esc(x.donation_date)}</small></div>`).join('')||'<p class="empty">No donations.</p>')}async function showCamps(rows){modal('<h2>Upcoming camps</h2>'+rows.map(x=>`<div class="item"><strong>${esc(x.name)}</strong><small>${esc(x.facility)} • ${esc(x.city)} • ${esc(x.camp_date)} • ${esc(x.start_time)}–${esc(x.end_time)}</small></div>`).join('')||'<p class="empty">No camps.</p>')}function modal(html){$('content').innerHTML=html;$('modal').classList.add('show')}async function trackRequest(id){const d=await api('/request-actions?requestId='+encodeURIComponent(id));const r=d.request;const actions=r.status==='Donor Accepted'?`<button class="btn btn-primary" onclick="updateRequest('${id}','contacted', '${d.responses[0]?.id||''}')">Mark contacted</button> <button class="btn btn-soft" onclick="updateRequest('${id}','fulfilled','${d.responses[0]?.id||''}')">Mark fulfilled</button>`:r.status==='Donor Contacted'?`<button class="btn btn-primary" onclick="updateRequest('${id}','fulfilled','${d.responses[0]?.id||''}')">Mark fulfilled</button>`:r.status==='Open'?'<span class="empty">Waiting for donor response</span>':r.status==='Fulfilled'?'<span class="pill ok">Completed</span>':'<span class="empty">No further action</span>';modal(`<h2>Request tracking</h2><p><b>${esc(r.blood_group)} • ${r.units} unit${r.units>1?'s':''}</b><br>${esc(r.facility)} • ${esc(r.city)}</p><div class="item"><strong>Status</strong><span class="pill ${r.status==='Fulfilled'?'ok':''}">${esc(r.status)}</span></div>${d.fulfillment?`<div class="item"><strong>Inventory fulfillment</strong><small>${esc(d.fulfillment.units)} unit(s) issued from ${esc(d.fulfillment.facility)}, ${esc(d.fulfillment.city)}</small></div>`:''}<div class="item"><strong>Donor responses</strong>${d.responses.length?d.responses.map(x=>`<div style="margin-top:8px"><b>${esc(x.name)}</b><small> • ${esc(x.email)}</small><br><span class="pill ${x.status==='Accepted'||x.status==='Donor Contacted'||x.status==='Fulfilled'?'ok':''}">${esc(x.status)}</span></div>`).join(''): '<p class="empty">No donor has responded yet.</p>'}</div><div class="actions">${actions}</div>`)}async function updateRequest(id,action,responseId){const d=await api('/request-actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:id,action,responseId})});modal('<h2>Status updated</h2><p>'+esc(d.status)+' — the workflow has been updated successfully.</p>');load()}async function findMatches(id){const d=await api('/matches?requestId='+encodeURIComponent(id));modal(`<h2>Smart donor matching</h2><p style="color:#6b7280">${esc(d.request.blood_group)} • ${d.request.units} unit${d.request.units>1?'s':''} • ${esc(d.request.city)}</p><div class="item"><strong>Compatible blood groups</strong><small>${esc(d.compatibleBloodGroups.join(', '))}</small></div>`+(d.matches.length?d.matches.map(x=>`<div class="item"><strong>${esc(x.name)}</strong><small>${esc(x.blood_group)} • ${esc(x.city)} • ${esc(x.email)}</small><div><span class="pill ok">${x.blood_group===d.request.blood_group?'Exact match':'Compatible donor'}</span></div></div>`).join(''):'<p class="empty">No available compatible donors found. Try again later or use the inventory view.</p>'))}async function requestModal(emergency=false){modal(`<h2>${emergency?'Emergency SOS blood request':'Create blood request'}</h2><p style="color:#6b7280;margin-top:-8px">${emergency?'Use this for time-sensitive blood requirements.':'Create a request that can be tracked from your workspace.'}</p><form id="rf"><div class="field"><label>Blood group</label><select name="bloodGroup"><option>O+</option><option>O−</option><option>A+</option><option>A−</option><option>B+</option><option>B−</option><option>AB+</option><option>AB−</option></select></div><div class="field"><label>Units</label><input name="units" type="number" min="1" value="1"></div><div class="field"><label>Facility</label><input name="facility" required></div><div class="field"><label>City</label><input name="city" required></div><div class="field"><label>Urgency</label><select name="urgency"><option ${emergency?'selected':''}>${emergency?'Critical':'Urgent'}</option>${emergency?'':'<option>Critical</option>'}<option>Routine</option></select></div><button class="btn btn-primary">${emergency?'Send SOS request':'Submit request'}</button></form>`);$('rf').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.units=Number(o.units);await api('/my-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});$('modal').classList.remove('show');load()}}async function toggleAvailability(){me.available=!me.available;await api('/me',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:me.name,role:me.role,bloodGroup:me.blood_group,city:me.city,available:me.available})});load()}$('edit').onclick=()=>modal(`<h2>Edit profile</h2><form id="pf"><div class="field"><label>Name</label><input name="name" value="${esc(me.name)}" required></div><div class="field"><label>Role</label><select name="role"><option value="donor" ${me.role==='donor'?'selected':''}>Donor</option><option value="requester" ${me.role==='requester'?'selected':''}>Requester / Patient</option><option value="hospital" ${me.role==='hospital'?'selected':''}>Hospital</option><option value="blood_bank" ${me.role==='blood_bank'?'selected':''}>Blood Bank</option></select></div><div class="field"><label>Blood group</label><select name="bloodGroup"><option value="">Not set</option><option>O+</option><option>O−</option><option>A+</option><option>A−</option><option>B+</option><option>B−</option><option>AB+</option><option>AB−</option></select></div><div class="field"><label>City</label><input name="city" value="${esc(me.city||'')}" required></div><button class="btn btn-primary">Save profile</button></form>`);$('pf').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.available=me.available;await api('/me',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});$('modal').classList.remove('show');load()}};$('requestBtn').onclick=()=>requestModal();$('donationBtn').onclick=()=>modal(`<h2>Record donation</h2><form id="df"><div class="field"><label>Facility</label><input name="facility" required></div><div class="field"><label>City</label><input name="city" value="${esc(me.city||'')}" required></div><div class="field"><label>Units</label><input name="units" type="number" min="1" value="1"></div><button class="btn btn-primary">Save donation</button></form>`);$('df').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.donorName=me.name;o.donorEmail=me.email;o.bloodGroup=me.blood_group;if(!o.bloodGroup)return alert('Please set your blood group in your profile first.');await api('/donations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});$('modal').classList.remove('show');load()};$('campBtn').onclick=async()=>{const c=await api('/camps');modal('<h2>Upcoming camps</h2>'+c.map(x=>`<div class="item"><strong>${esc(x.name)}</strong><small>${esc(x.facility)} • ${esc(x.city)} • ${esc(x.camp_date)} • ${esc(x.start_time)}–${esc(x.end_time)}</small><div><span class="pill ok">${x.slots_remaining} slots left</span></div></div>`).join('')||'<p class="empty">No upcoming camps.</p>')};$('notify').onclick=async()=>{const n=await api('/notifications');modal('<h2>Notifications</h2>'+n.map(x=>`<div class="item"><strong>${esc(x.title)}</strong><small>${esc(x.body)}</small></div>`).join('')||'<p class="empty">No notifications.</p>');await api('/notifications',{method:'PATCH'})};$('close').onclick=()=>$('modal').classList.remove('show');$('signout').onclick=async()=>{await hatchable.auth.signOut();location.href='/'};load().catch(e=>{if(e.message!=='login')alert(e.message)});setInterval(async()=>{try{const ns=await api('/notifications');const unread=ns.filter(x=>!x.read).length;$('notify').textContent=unread?`Notifications (${unread})`:'Notifications';if(me?.role==='donor'&&unread)showEmergencyToast(ns)}catch(e){}},20000);let lastEmergencyId=null;function showEmergencyToast(ns){const n=ns.find(x=>x.type==='emergency'&&!x.read);if(!n||n.id===lastEmergencyId)return;lastEmergencyId=n.id;const old=$('notify').textContent;$('notify').textContent='🚨 '+old;setTimeout(()=>{if($('notify'))$('notify').textContent=old},6000)};</script></body></html>
