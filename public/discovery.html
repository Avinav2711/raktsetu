<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaktSetu — Donor Discovery</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>.wrap{max-width:1150px;margin:auto;padding:36px 22px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.head h1{font:800 32px Manrope;margin:5px 0}.muted{color:#6b7280}.panel{background:#fff;border:1px solid #e7e7ea;border-radius:16px;padding:20px;margin-bottom:18px}.filters{display:grid;grid-template-columns:1fr 180px 1fr auto;gap:10px}.filters input,.filters select{padding:11px;border:1px solid #ddd;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.donor{border:1px solid #e7e7ea;border-radius:14px;padding:16px}.donor h3{margin:0 0 6px;font:800 18px Manrope}.meta{color:#6b7280;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f0fdf4;color:#166534;font-size:12px;font-weight:700;margin-top:10px}.empty{color:#6b7280;padding:15px 0}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.filters,.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brandmark">✦</span><span>Rakt<span>Setu</span></span></a><div class="actions"><button class="btn btn-outline" onclick="location.href='/portal.html'">My Workspace</button><button class="btn btn-outline" id="signout">Sign out</button></div></header><main class="wrap"><div class="head"><div><div class="eyebrow">DONOR DISCOVERY</div><h1>Find available donors</h1><p class="muted">Search verified RaktSetu donor profiles by blood group and city. Contact details are intentionally not exposed in the directory.</p></div></div><section class="panel"><div class="filters"><input id="q" placeholder="Search donor or city"><select id="blood"><option value="">All blood groups</option><option>O+</option><option>O−</option><option>A+</option><option>A−</option><option>B+</option><option>B−</option><option>AB+</option><option>AB−</option></select><input id="city" placeholder="City"><button class="btn btn-primary" onclick="load()">Search</button></div></section><section class="panel"><div id="count" class="muted" style="margin-bottom:14px">Loading donors…</div><div id="list" class="grid"></div></section></main><script>const API=window.__HATCHABLE__?.api||'/api';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#39;','"':'&quot;'}[c]));async function api(path,opt){const r=await fetch(API+path,opt);if(r.status===401){location.href='/login?next=/discovery.html';throw new Error('login')}const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){try{const p=new URLSearchParams({q:$('q').value,bloodGroup:$('blood').value,city:$('city').value});const d=await api('/donor-discovery?'+p);$('count').textContent=d.donors.length+' available donor'+(d.donors.length===1?'':'s')+' found';$('list').innerHTML=d.donors.map(x=>`<article class="donor"><h3>${esc(x.name||'RaktSetu Donor')}</h3><div><b>${esc(x.blood_group)}</b></div><div class="meta">${esc(x.city||'City not set')}</div><span class="pill">Available</span></article>`).join('')||'<div class="empty">No available donors match these filters.</div>'}catch(e){if(e.message!=='login'){$('count').textContent=e.message;$('list').innerHTML=''}}}$('signout').onclick=async()=>{await hatchable.auth.signOut();location.href='/'};load()</script></body></html>
