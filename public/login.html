<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — RaktSetu</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>.authpage{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:30px}.authcard{width:min(460px,100%);background:#fff;border:1px solid #e7e7ea;border-radius:20px;padding:34px;box-shadow:0 20px 60px #15171b12}.authcard h1{font:800 30px Manrope;margin:10px 0}.authcard p{color:#6b7280;line-height:1.6}.authcard .field{margin-top:20px}.code{display:none}.code.show{display:block}.msg{margin-top:15px;color:#991b1b;font-size:13px}.back{display:inline-block;margin-top:20px;color:#991b1b;text-decoration:none;font-weight:700}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brandmark">✦</span><span>Rakt<span>Setu</span></span></a><a class="sectionlink" href="/">Back to home</a></header><main class="authpage"><div class="authcard"><div class="eyebrow">RAKTSETU PORTAL</div><h1>Sign in to coordinate.</h1><p>Use your email to receive a secure one-time code. No password required.</p><form id="form"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username webauthn" required placeholder="you@example.com"></div><div class="field code" id="codeWrap"><label>6-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div><button class="btn btn-primary" id="submit" type="submit">Continue</button></form><div class="msg" id="msg"></div><a class="back" href="/">← Return to RaktSetu</a></div></main><script>const next=new URLSearchParams(location.search).get('next');let step='email',hasPasskey=false;const email=document.getElementById('email'),code=document.getElementById('code'),wrap=document.getElementById('codeWrap'),submit=document.getElementById('submit'),msg=document.getElementById('msg');document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.textContent='';try{if(step==='email'){const r=await hatchable.auth.startLogin({email:email.value});hasPasskey=!!r.has_passkey;if(hasPasskey&&hatchable.auth.supportsPasskeys()){try{const d=await hatchable.auth.signInWithPasskey({email:email.value});location.href=next&&next.startsWith('/')?next:'/portal.html';return}catch{}}step='code';wrap.classList.add('show');submit.textContent='Sign in';code.focus();}else{await hatchable.auth.verifyCode({email:email.value,code:code.value});location.href=next&&next.startsWith('/')?next:'/portal.html';}}catch(err){msg.textContent=err.message||'Unable to sign in. Please try again.'}}</script></body></html>
