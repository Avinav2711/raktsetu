<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaktSetu — Operations Center</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>.ops{max-width:1250px;margin:auto;padding:34px 22px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.head h1{font:800 32px Manrope;margin:5px 0}.muted{color:#6b7280}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e7e7ea;border-radius:16px;padding:18px}.card strong{font:800 27px Manrope;display:block}.card span{color:#6b7280;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab.active{background:#111827;color:#fff}.panel{margin-bottom:18px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid #ddd;border-radius:9px;background:#fff}.toolbar>*{max-width:220px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee;font-size:13px}.table th{color:#6b7280;font-weight:600}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fef2f2;color:#991b1b;font-size:12px;font-weight:700}.ok{background:#f0fdf4;color:#166534}.warn{background:#fff7ed;color:#9a3412}.urgent{background:#fef2f2;color:#991b1b}.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.item strong{display:block}.item small{color:#6b7280}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}.danger{border-color:#fecaca}.empty{color:#6b7280}@media(max-width:950px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}.table{font-size:12px}.table th:nth-child(4),.table td:nth-child(4){display:none}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brandmark">✦</span><span>Rakt<span>Setu</span></span></a><div class="actions"><button class="btn btn-outline" onclick="location.href='/portal.html'">My Workspace</button><button class="btn btn-outline" id="signout">Sign out</button></div></header><main class="ops"><div class="head"><div><div class="eyebrow">OPERATIONS CENTER</div><h1 id="title">Loading…</h1><p class="muted">Monitor blood supply, prioritize requests, and maintain an auditable inventory.</p></div></div><div class="cards"><div class="card"><strong id="c1">—</strong><span>Inventory lines</span></div><div class="card"><strong id="c2">—</strong><span>Total units</span></div><div class="card"><strong id="c3">—</strong><span>Critical stock lines</span></div><div class="card"><strong id="c4">—</strong><span>Open requests</span></div><div class="card"><strong id="c5">—</strong><span>Critical requests</span></div></div><div class="tabs"><button class="btn tab active" data-tab="inventory">Inventory</button><button class="btn tab" data-tab="requests">Requests</button><button class="btn tab" data-tab="history">Audit history</button></div><section class="panel" id="inventoryTab"><div class="toolbar"><input id="search" placeholder="Search blood group, facility, city"><select id="status"><option value="">All statuses</option><option>Available</option><option>Critical</option><option>Out of stock</option><option>Expired</option></select><button class="btn btn-primary" onclick="openAdd()">+ Add stock</button><button class="btn btn-soft" onclick="refresh()">Refresh</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>Blood</th><th>Facility</th><th>City</th><th>Units</th><th>Status</th><th>Actions</th></tr></thead><tbody id="inventory"></tbody></table></div></section><section class="panel" id="requestsTab" style="display:none"><div class="toolbar"><select id="urgency"><option value="">All urgency</option><option>Critical</option><option>Urgent</option><option>Routine</option></select><button class="btn btn-soft" onclick="refresh()">Refresh</button></div><div id="requests"></div></section><section class="panel" id="historyTab" style="display:none"><div class="toolbar"><button class="btn btn-soft" onclick="refresh()">Refresh history</button></div><div id="history"></div></section></main><div class="modal-backdrop" id="modal"><div class="modal"><button class="close" onclick="closeModal()">×</button><div id="content"></div></div></div><script>const API=window.__HATCHABLE__?.api||'/api';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#39;','"':'&quot;'}[c]));let data={inventory:[],transactions:[],requests:[]};async function api(path,opt){const r=await fetch(API+path,opt);if(r.status===401){location.href='/login?next=/operator.html';throw new Error('login')}const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function refresh(){try{const [inv,reqs]=await Promise.all([api('/inventory-actions'),api('/requests')]);data.inventory=inv.inventory||[];data.transactions=inv.transactions||[];data.requests=reqs||[];render()}catch(e){if(e.message!=='login')alert(e.message)}}function render(){const critical=data.inventory.filter(x=>x.status==='Critical'||x.status==='Out of stock');$('c1').textContent=data.inventory.length;$('c2').textContent=data.inventory.reduce((a,x)=>a+Number(x.units||0),0);$('c3').textContent=critical.length;$('c4').textContent=data.requests.filter(x=>['Open','Donor Accepted','Donor Contacted'].includes(x.status)).length;$('c5').textContent=data.requests.filter(x=>x.urgency==='Critical'&&x.status!=='Fulfilled').length;renderInventory();renderRequests();renderHistory()}function renderInventory(){const q=$('search').value.toLowerCase();const st=$('status').value;const rows=data.inventory.filter(x=>(!q||[x.blood_group,x.facility,x.city].join(' ').toLowerCase().includes(q))&&(!st||x.status===st));$('inventory').innerHTML=rows.map(x=>`<tr><td><b>${esc(x.blood_group)}</b></td><td>${esc(x.facility)}</td><td>${esc(x.city)}</td><td><b>${x.units}</b></td><td><span class="pill ${x.status==='Available'?'ok':x.status==='Critical'?'warn':''}">${esc(x.status)}</span></td><td><div class="actions"><button class="btn btn-soft" onclick="changeStock('${x.id}','add')">+ Add</button><button class="btn btn-soft" onclick="changeStock('${x.id}','remove')">− Remove</button><button class="btn btn-outline" onclick="changeStock('${x.id}','adjust')">Set</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No inventory matches your filters.</td></tr>'}function renderRequests(){const u=$('urgency').value;const rows=data.requests.filter(x=>!u||x.urgency===u).sort((a,b)=>{const rank={Critical:0,Urgent:1,Routine:2};return (rank[a.urgency]??9)-(rank[b.urgency]??9)||String(b.created_at).localeCompare(String(a.created_at))});$('requests').innerHTML=rows.slice(0,60).map(x=>`<div class="item"><strong>${x.urgency==='Critical'?'🚨 ':''}${esc(x.blood_group)} • ${x.units} unit${x.units>1?'s':''}</strong><small>${esc(x.facility)} • ${esc(x.city)} • ${esc(x.requester_name)} • ${esc(x.created_at).slice(0,16)}</small><div class="actions"><span class="pill ${x.urgency==='Critical'?'urgent':x.status==='Fulfilled'?'ok':''}">${esc(x.urgency)} • ${esc(x.status)}</span><button class="btn btn-soft" onclick="showRequestMatches('${x.id}')">Find donors</button></div></div>`).join('')||'<p class="empty">No requests found.</p>'}async function showRequestMatches(id){try{const d=await api('/matches?requestId='+encodeURIComponent(id));modal(`<h2>Donor discovery</h2><p class="muted">${esc(d.request.blood_group)} • ${d.request.units} unit(s) • ${esc(d.request.city)}</p><div class="item"><strong>Compatible groups</strong><small>${esc(d.compatibleBloodGroups.join(', '))}</small></div>`+(d.matches.length?d.matches.map(x=>`<div class="item"><strong>${esc(x.name)}</strong><small>${esc(x.blood_group)} • ${esc(x.city)}</small><div><span class="pill ok">${x.blood_group===d.request.blood_group?'Exact match':'Compatible donor'}</span></div></div>`).join(''):'<p class="empty">No available compatible donors found.</p>'))}catch(e){alert(e.message)}}function renderHistory(){$('history').innerHTML=data.transactions.map(x=>`<div class="item"><strong>${esc(x.blood_group)} • ${esc(x.action)} • ${x.units_change>0?'+':''}${x.units_change} units</strong><small>${esc(x.facility)} • ${esc(x.city)} • ${x.previous_units} → ${x.new_units} • ${esc(x.reason||'No reason')} • ${esc(x.created_at)}</small></div>`).join('')||'<p class="empty">No inventory transactions yet.</p>'}function modal(html){$('content').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function openAdd(){modal(`<h2>Add blood stock</h2><form id="add"><div class="field"><label>Facility</label><input name="facility" required></div><div class="field"><label>City</label><input name="city" required></div><div class="field"><label>Blood group</label><select name="bloodGroup"><option>O+</option><option>O−</option><option>A+</option><option>A−</option><option>B+</option><option>B−</option><option>AB+</option><option>AB−</option></select></div><div class="field"><label>Units</label><input name="units" type="number" min="1" required></div><button class="btn btn-primary">Create inventory line</button></form>`);$('add').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.units=Number(o.units);try{await api('/inventory-actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',units:o.units,facility:o.facility,city:o.city,bloodGroup:o.bloodGroup,reason:'Initial stock entry'})});closeModal();refresh()}catch(err){alert(err.message)}}}function changeStock(id,action){const item=data.inventory.find(x=>x.id===id);if(!item)return;const label=action==='add'?'Units to add':action==='remove'?'Units to remove':'New stock level';modal(`<h2>${action==='add'?'+ Add stock':action==='remove'?'− Remove stock':'Set stock level'}</h2><p class="muted">${esc(item.blood_group)} • ${esc(item.facility)} • current: ${item.units} units</p><form id="chg"><div class="field"><label>${label}</label><input name="units" type="number" min="${action==='adjust'?'0':'1'}" value="${action==='adjust'?item.units:1}" required></div><div class="field"><label>Reason</label><input name="reason" placeholder="e.g. donation, expiry, issue"></div><button class="btn btn-primary">Save change</button></form>`);$('chg').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/inventory-actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,inventoryId:id,units:Number(f.get('units')),reason:f.get('reason')})});closeModal();refresh()}catch(err){alert(err.message)}}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['inventory','requests','history'].forEach(x=>$(x+'Tab').style.display=x===b.dataset.tab?'block':'none')});$('search').oninput=renderInventory;$('status').onchange=renderInventory;$('urgency').onchange=renderRequests;$('signout').onclick=async()=>{await hatchable.auth.signOut();location.href='/'};api('/me').then(me=>{if(!['hospital','blood_bank'].includes(me.role)){alert('This page is only for hospital and blood bank operators.');location.href='/portal.html';return}$('title').textContent=(me.role==='blood_bank'?'Blood Bank':'Hospital')+' Operations';refresh()}).catch(e=>{if(e.message!=='login')alert(e.message)});</script></body></html>
